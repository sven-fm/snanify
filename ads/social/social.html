<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Eczar:wght@600;700;800&family=Martel+Sans:wght@400;700;800&family=Noto+Serif+Devanagari:wght@400;600&display=block" rel="stylesheet">
<style>
  /* The daily Facebook post, 1080 x 1350, built from the brand kit
     (brand/README.md; DESIGNSYSTEM.md is canonical). Four styles:
     - plain: the current direction. Solid marigold, ink capitals with the
       river's name and the key words in sindoor, the press on its ink wall,
       the seal, and the river at the foot.
     - calendar: calendar art for festival days. Maroon in a haldi double
       frame, the brand's river painted as a scene, a sentence-case title.
     - signboard: a scroll-stopper. Marigold, sindoor stripes along the top,
       huge stacked capitals.
     - matchbox: the eleven-morning pack only, its label on paper.
     Motion is the brand's own and nothing else: flow (the waves drift, the
     sun's path shimmers), pull (a stepped entrance), stamp (the seal lands),
     sink (the press goes down into its wall), breathe and count (the breath).
     Every moving part is a pure function of time, set by frame(t); a still
     post is its last frame. Flat colour, square corners, round things drawn. */
  * { margin: 0; box-sizing: border-box; }
  :root { --y: #f2c230; --k: #141210; --r: #c8251d; --t: #1d5a6a; --p: #f2ead9; --h: #e3962b; --m: #7a1a14; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { font-family: "Martel Sans", sans-serif; color: var(--k); }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .d { font-family: "Eczar", serif; font-synthesis: none; }
  .caps { text-transform: uppercase; }
  [lang="hi"] .caps { text-transform: none; }
  .r { color: var(--r); }
  .col { position: relative; height: 100%; display: flex; flex-direction: column; padding: 76px 72px 0; z-index: 1; }
  .grow { flex: 1; min-height: 16px; }
  .lines > span { display: block; white-space: nowrap; }
  /* Hindi on a drawn image: Noto Serif Devanagari, so conjuncts stack. The
     display headline keeps Eczar 800 at 1.22. */
  [lang="hi"] .t { font-family: "Noto Serif Devanagari", serif; font-weight: 600; }

  /* The v3 wordmark and mark, measured as in globals.css. */
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 40px; }
  .top .when { font-weight: 700; font-size: 28px; }
  [lang="hi"] .top .when { font-family: "Noto Serif Devanagari", serif; font-weight: 600; }
  .wm { font-family: "Eczar", serif; font-weight: 800; letter-spacing: -0.015em; line-height: 1; font-synthesis: none; display: inline-block; }
  .wm-i { position: relative; display: inline-block; }
  .wm-i svg { position: absolute; left: 53.6%; bottom: 0.789em; width: 0.237em; height: 0.237em; transform: translateX(-50%); }
  .lock { display: inline-flex; align-items: center; gap: 0.5em; }
  .lock > svg { width: 1.25em; height: 1.25em; flex: none; }

  /* The display headline: Eczar 800, tight capitals, 0.95. */
  .big { font-weight: 800; line-height: 0.95; letter-spacing: -0.01em; }
  [lang="hi"] .big { line-height: 1.22; letter-spacing: 0; }
  .head { margin-top: 44px; }
  .sub { font-weight: 700; font-size: 40px; line-height: 1.3; margin-top: 26px; }
  [lang="hi"] .sub { line-height: 1.6; font-size: 38px; }

  /* Ruled rows, as the Page's river list: the key in sindoor Eczar. */
  .rows { margin-top: 30px; border-top: 4px solid var(--k); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; border-bottom: 2px solid var(--k); padding: 14px 0 8px; }
  .row .k { font-family: "Eczar", serif; font-weight: 800; font-size: 40px; color: var(--r); line-height: 1.1; white-space: nowrap; }
  .row .v { font-weight: 700; font-size: 31px; text-align: right; white-space: nowrap; }
  .rows.tight .row { padding: 9px 0 4px; }
  .rows.tight .row .k { font-size: 34px; }
  .rows.tight .row .v { font-size: 28px; }
  [lang="hi"] .row .k { line-height: 1.35; }

  /* The offer and the press: sindoor, an ink border, a hard ink wall. */
  .offer { font-family: "Eczar", serif; font-weight: 800; font-size: 40px; text-align: center; margin-bottom: 22px; }
  [lang="hi"] .offer { line-height: 1.4; }
  .pressrow { position: relative; }
  .press { display: flex; align-items: center; justify-content: space-between; gap: 24px; width: calc(100% - 9px); background: var(--r); color: #fff; border: 3px solid var(--k); box-shadow: 9px 9px 0 0 var(--k); padding: 26px 34px 20px; }
  .press .go { font-family: "Eczar", serif; font-weight: 800; font-size: 62px; line-height: 1; white-space: nowrap; }
  [lang="hi"] .press .go { line-height: 1.3; }
  .press .url { font-weight: 700; font-size: 32px; white-space: nowrap; }

  /* The seal: a sindoor stamp, marigold Eczar 800, a dashed marigold ring. */
  .seal { position: absolute; width: 230px; height: 230px; z-index: 3; }
  .seal svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .seal .sv { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--y); font-family: "Eczar", serif; font-weight: 800; }
  .seal .a { font-size: 84px; line-height: 0.9; }
  .seal .b { font-size: 27px; line-height: 1.1; max-width: 72%; margin-top: 6px; }
  [lang="hi"] .seal .b { font-family: "Noto Serif Devanagari", serif; font-weight: 600; line-height: 1.35; font-size: 25px; }

  /* The band: ink, marigold Martel 800, turned -2deg, off both edges. */
  .band { margin: 40px -90px 0; background: var(--k); color: var(--y); padding: 22px 90px 16px; font-weight: 800; font-size: 40px; line-height: 1.25; transform: rotate(-2deg); }
  [lang="hi"] .band { line-height: 1.6; font-family: "Noto Serif Devanagari", serif; font-weight: 600; }

  /* The river at the foot: an ink horizon, the sun cut by it, teal waves. */
  .river { display: block; flex: none; margin: 34px -72px 0; }

  /* --- plain ----------------------------------------------------------------- */
  .plain { background: var(--y); }
  .phone { position: relative; width: 330px; flex: none; aspect-ratio: 9 / 18.6; background: var(--k); border-radius: 52px; padding: 16px; }
  .phone .screen { width: 100%; height: 100%; border-radius: 38px; overflow: hidden; background: var(--p); }
  .phone .screen img { width: 100%; display: block; }
  .sheet { width: 460px; border: 3px solid var(--k); box-shadow: 12px 12px 0 0 var(--k); background: var(--p); }
  .sheet img { width: 100%; display: block; }
  .split.wide { grid-template-columns: minmax(0, 1fr) 460px; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 34px; align-items: start; margin-top: 44px; }
  .split .head { margin-top: 0; }
  .tank { position: relative; margin-top: 34px; flex: 8; min-height: 0; border: 3px solid var(--k); background: var(--p); overflow: hidden; }
  .tank svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tank .num { position: absolute; left: 0; right: 0; top: 26px; text-align: center; font-family: "Eczar", serif; font-weight: 800; font-size: 120px; line-height: 1; }
  .tank .say { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-weight: 700; font-size: 36px; }

  /* --- signboard ---------------------------------------------------------------- */
  .sign { background: var(--y); }
  .sign .col { padding-top: 100px; }
  .sign .box { margin-top: 34px; background: var(--k); color: var(--p); padding: 30px 34px 24px; }
  .sign .box .h { font-family: "Eczar", serif; font-weight: 800; color: var(--y); font-size: 50px; line-height: 1.05; }
  [lang="hi"] .sign .box .h { line-height: 1.35; }
  .sign .box .p { font-size: 32px; line-height: 1.45; margin-top: 12px; }
  [lang="hi"] .sign .box .p { line-height: 1.7; }

  /* --- matchbox, the eleven-morning pack only ------------------------------------ */
  .match { background: var(--p); }
  .label { margin-top: 44px; background: var(--y); border: 12px solid var(--k); padding: 12px; }
  .label .in { border: 4px solid var(--r); padding: 26px 30px 30px; text-align: center; }
  .label .em { display: block; margin: 0 auto; width: 300px; height: 190px; }
  .label .nm { font-family: "Eczar", serif; font-weight: 800; line-height: 0.95; letter-spacing: -0.01em; margin-top: 18px; }
  .label .tg { font-weight: 700; font-size: 32px; margin-top: 14px; }

  /* --- calendar art --------------------------------------------------------------- */
  .cal { background: var(--m); color: var(--p); }
  .cal .frame { position: absolute; inset: 30px; border: 10px double var(--h); z-index: 2; pointer-events: none; }
  .cal .col { padding: 72px 82px 78px; text-align: center; }
  .cal .orn { display: block; margin: 0 auto; }
  .cal .kick { font-family: "Eczar", serif; font-weight: 700; font-size: 38px; color: var(--h); margin-top: 8px; }
  [lang="hi"] .cal .kick { line-height: 1.4; }
  .cal .scene { position: relative; flex: 1; min-height: 0; margin-top: 22px; border: 6px solid var(--h); overflow: hidden; }
  .cal .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cal .title { font-weight: 800; line-height: 1; margin-top: 26px; letter-spacing: -0.01em; }
  [lang="hi"] .cal .title { line-height: 1.3; margin-top: 18px; }
  .cal .csub { font-family: "Eczar", serif; font-weight: 700; font-size: 42px; color: var(--h); margin-top: 10px; line-height: 1.2; }
  [lang="hi"] .cal .csub { line-height: 1.45; }
  .cal .line { font-size: 31px; line-height: 1.45; margin-top: 12px; }
  [lang="hi"] .cal .line { line-height: 1.7; font-size: 29px; }
  .cal .rows { border-top-color: var(--h); text-align: left; margin-top: 20px; }
  .cal .row { border-bottom-color: var(--h); padding: 10px 0 5px; }
  .cal .row .k { color: var(--p); font-family: "Martel Sans", sans-serif; font-weight: 700; font-size: 28px; }
  [lang="hi"] .cal .row .k { font-family: "Noto Serif Devanagari", serif; font-weight: 600; line-height: 1.5; }
  .cal .row .v { color: var(--y); font-family: "Eczar", serif; font-weight: 800; font-size: 34px; }
  .cal .bar { margin-top: 24px; background: var(--h); color: var(--k); display: flex; justify-content: center; align-items: baseline; gap: 26px; padding: 22px 20px 16px; }
  .cal .bar .go { font-family: "Eczar", serif; font-weight: 800; font-size: 50px; line-height: 1; white-space: nowrap; }
  [lang="hi"] .cal .bar .go { line-height: 1.3; }
  .cal .bar .url { font-family: "Eczar", serif; font-weight: 800; font-size: 32px; white-space: nowrap; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const p = JSON.parse(decodeURIComponent(location.hash.slice(1)));
  document.documentElement.lang = p.lang;
  document.body.dataset.script = p.lang === "hi" ? "devanagari" : "latin";
  const hi = p.lang === "hi";
  const W = 1080;
  const C = { y: "#f2c230", k: "#141210", r: "#c8251d", t: "#1d5a6a", p: "#f2ead9", h: "#e3962b", m: "#7a1a14" };
  const f2 = (n) => Number(n).toFixed(2);
  const esc = (t) => String(t ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
  /* *Starred* words go sindoor: the river's name and the one key word. */
  const red = (t) => esc(t).replace(/\*(.+?)\*/g, '<span class="r">$1</span>');
  const lines = (t) => String(t).split("|").map((l) => `<span>${red(l)}</span>`).join("");
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => [...document.querySelectorAll(s)];
  window.DURATION = p.dur || 7;

  /* --- the clock --------------------------------------------------------------- */
  const anims = [];
  const on = (fn) => anims.push(fn);
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const span = (t, a, b) => clamp((t - a) / (b - a));
  const stepped = (x, n) => Math.floor(clamp(x) * n + 1e-9) / n;
  const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  window.frame = (t) => { for (const fn of anims) fn(t); };
  /* pull: a stepped entrance, steps(6), as a sheet is pulled from the press. */
  function pull(el, at, dist = 28, dur = 0.36) {
    if (!el) return;
    on((t) => { const k = stepped(span(t, at, at + dur), 6); el.style.opacity = f2(k); el.style.translate = `0 ${f2((1 - k) * dist)}px`; });
  }
  /* stamp: the seal lands from 1.15 and -14deg to its rest in 180ms, stepped. */
  function stamp(el, at, rest) {
    on((t) => {
      const k = stepped(span(t, at, at + 0.18), 3);
      el.style.opacity = t < at ? "0" : "1";
      el.style.transform = `rotate(${f2(-14 + (rest + 14) * k)}deg) scale(${f2(1.15 - 0.15 * k)})`;
    });
  }
  /* sink: the press goes down into its wall in 70ms and rises in 120ms. */
  function sink(el, at) {
    on((t) => {
      const d = t < at ? 0 : t < at + 0.07 ? (t - at) / 0.07 : t < at + 0.35 ? 1 : 1 - clamp((t - at - 0.35) / 0.12);
      el.style.transform = `translate(${f2(9 * d)}px, ${f2(9 * d)}px)`;
      el.style.boxShadow = `${f2(9 * (1 - d))}px ${f2(9 * (1 - d))}px 0 0 #141210`;
    });
  }

  /* --- the mark and the wordmark (src/lib/logo-svg.ts) -------------------------- */
  const MARK = (ink, paper) => `<svg viewBox="0 0 48 48" aria-hidden="true"><defs><clipPath id="mk"><circle cx="24" cy="24" r="20"/></clipPath></defs><circle cx="24" cy="24" r="21.6" fill="${paper}" stroke="${ink}" stroke-width="2.4"/><g clip-path="url(#mk)"><path d="M15.4 24.6A8.6 8.6 0 0 1 32.6 24.6Z" fill="#c8251d"/><rect y="24.6" width="48" height="1.4" fill="${ink}"/><g fill="#1d5a6a"><rect x="8" y="29" width="32" height="1.8"/><rect x="5" y="33.4" width="38" height="2"/><rect x="2" y="38" width="44" height="2.2"/></g></g></svg>`;
  const LOCK = (ink, paper) => `<span class="lock" style="color:${ink}">${MARK(ink, paper)}<span class="wm">Snan<span class="wm-i">ı<svg viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="#c8251d"/></svg></span>fy</span></span>`;
  const topRow = () => `<div class="top">${LOCK(C.k, C.p)}${p.when ? `<span class="when">${esc(p.when)}</span>` : ""}</div>`;

  /* --- the seal ------------------------------------------------------------------ */
  const seal = (s, style) => s ? `<div class="seal" style="${style}"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#c8251d"/><circle cx="50" cy="50" r="44" fill="none" stroke="#f2c230" stroke-width="1.6" stroke-dasharray="4 3"/></svg><div class="sv"><div class="a">${esc(s.a)}</div><div class="b">${esc(s.b)}</div></div></div>` : "";

  /* --- the river (src/lib/river-geometry.ts, ported) ------------------------------ */
  function waveRows(width, height, rows, top) {
    const k = width / 260, out = [];
    for (let i = 0; i < rows; i++) {
      const t = rows > 1 ? i / (rows - 1) : 0;
      const y = top + (height - top - 4) * Math.pow(t, 1.7);
      const amp = (0.5 + 2.6 * t) * k * 0.55, period = (40 + 50 * t) * k;
      const pts = [];
      for (let x = 0; x <= 2 * width + 1e-9; x += 6) pts.push(`${f2(x)},${f2(y + amp * Math.sin((2 * Math.PI * x) / period))}`);
      out.push({ y, t, period, stroke: Math.max(1.6, (0.6 + 1.2 * t) * k * 0.45), drift: 11 - 4 * t, points: pts.join(" ") });
    }
    return out;
  }
  function sunPath(rows, sunX, width) {
    const k = width / 260, out = [];
    rows.forEach((row, i) => {
      const t = row.t, centre = sunX + (width / 2 - sunX) * t, total = (5 + 64 * t) * k;
      const n = t < 0.3 ? 1 : t < 0.7 ? 2 : 3, w = total / (2 * n - 1), left = centre - total / 2, h = row.stroke * 2.4;
      for (let d = 0; d < n; d++) out.push({ x: left + d * 2 * w, y: row.y - h / 2, w, h, i });
    });
    return out;
  }
  /* A river in a w x h box: the ink horizon, the sun sitting on it and cut by
     it (a third hidden), the waves bunched toward the horizon, the path. */
  function river(w, h, o) {
    const hz = o.horizon, rows = waveRows(w, h, o.rows || 9, hz + 8);
    const sun = o.sunR ? `<clipPath id="sky${o.id}"><rect width="${w}" height="${f2(hz)}"/></clipPath><circle cx="${f2(o.sunX)}" cy="${f2(o.sunY ?? hz + 0.35 * o.sunR)}" r="${f2(o.sunR)}" fill="${o.sun || C.r}" clip-path="url(#sky${o.id})"/>` : "";
    const path = o.path ? sunPath(rows, o.sunX, w).map((d) => `<rect class="glint" x="${f2(d.x)}" y="${f2(d.y)}" width="${f2(d.w)}" height="${f2(d.h)}" fill="${o.path}"/>`).join("") : "";
    return `<svg class="${o.cls || "river"}" viewBox="0 0 ${w} ${f2(h)}" width="${w}" height="${f2(h)}" preserveAspectRatio="none">
      ${o.sky ? `<rect width="${w}" height="${f2(hz)}" fill="${o.sky}"/>` : ""}${o.water ? `<rect y="${f2(hz)}" width="${w}" height="${f2(h - hz)}" fill="${o.water}"/>` : ""}
      ${o.back || ""}${sun}
      <g class="waves">${rows.map((r) => `<polyline class="wave" data-p="${f2(r.period)}" data-d="${f2(r.drift)}" points="${r.points}" fill="none" stroke="${o.wave || C.t}" stroke-width="${f2(r.stroke)}"/>`).join("")}</g>
      ${path}<rect y="${f2(hz - 2.5)}" width="${w}" height="5" fill="${o.ink || C.k}"/>${o.front || ""}</svg>`;
  }
  /* flow: each wave line drifts by one period at its own pace; the path shimmers. */
  function flow() {
    const waves = $$(".wave"), glints = $$(".glint");
    on((t) => {
      waves.forEach((wv) => { const per = Number(wv.dataset.p), d = Number(wv.dataset.d); wv.setAttribute("transform", `translate(${f2(-(((t / d) * per) % per))} 0)`); });
      glints.forEach((g, j) => g.setAttribute("opacity", Math.floor(t * 2.5 + j * 0.7) % 3 === 0 ? "0.5" : "1"));
    });
  }
  /* The foot river, as on the Page cover (ads/src/page.html): the horizon at 96
     and the sun a full half dome on it, clear of the frame's bottom edge. */
  const footRiver = () => river(W, 200, { id: "f", horizon: 96, sunX: 840, sunR: 84, sunY: 96, rows: 7 });

  /* --- the press, the rows -------------------------------------------------------- */
  const press = () => `<div class="pressrow"><div class="press"><span class="go">${esc(p.cta)} →</span><span class="url">snanify.com</span></div></div>`;
  const foot = () => `${p.offer ? `<div class="offer">${esc(p.offer)}</div>` : ""}${press()}`;
  const rowsHtml = (rows) => rows ? `<div class="rows${rows.length > 4 ? " tight" : ""}">${rows.map(([k, v]) => `<div class="row"><span class="k">${red(k)}</span><span class="v t">${esc(v)}</span></div>`).join("")}</div>` : "";

  /* --- fitting ---------------------------------------------------------------------- */
  function fitLines(el, max, min, room) {
    let s = max; el.style.fontSize = s + "px";
    const width = room || el.clientWidth;
    const wide = () => [...el.querySelectorAll(":scope > span")].some((x) => x.scrollWidth > width + 1);
    while (s > min && wide()) { s -= 2; el.style.fontSize = s + "px"; }
  }
  function fitWidth(el, max, room, min = 26) {
    let s = max; el.style.fontSize = s + "px";
    while (s > min && el.scrollWidth > room) { s -= 2; el.style.fontSize = s + "px"; }
  }
  /* Step the type down together until the column fits the frame. */
  function fitColumn(col, els, floor = 0.66) {
    const base = els.map((e) => parseFloat(getComputedStyle(e).fontSize));
    let k = 1;
    while (col.scrollHeight > col.clientHeight + 1 && k > floor) { k -= 0.03; els.forEach((e, i) => { e.style.fontSize = f2(base[i] * k) + "px"; }); }
  }

  /* The seal goes where it touches nothing: the first clear spot down the
     right-hand side, then the left, stepping down in size (never under 66px,
     DESIGNSYSTEM.md; here never under 170). */
  function placeSeal(el) {
    const busy = $$(".head > span, .sub, .row, .box, .label, .offer, .pressrow, .band, .tank, .split .phone, .split .sheet, .top").map((e) => {
      const r = e.getBoundingClientRect();
      if (e.matches(".head > span")) { const rg = document.createRange(); rg.selectNodeContents(e); const q = rg.getBoundingClientRect(); return { l: q.left, t: q.top, r: q.right, b: q.bottom }; }
      return { l: r.left, t: r.top, r: r.right, b: r.bottom };
    });
    const hits = (x, y, d) => busy.some((b) => x < b.r + 10 && x + d > b.l - 10 && y < b.b + 10 && y + d > b.t - 10);
    for (const d of [230, 200, 170]) {
      for (const x of [W - 52 - d, W - 90 - d, 60]) {
        for (let y = 110; y < 1350 - 180 - d; y += 8) {
          if (!hits(x, y, d)) { Object.assign(el.style, { left: x + "px", top: y + "px", right: "auto", bottom: "auto", width: d + "px", height: d + "px" }); el.querySelector(".a").style.fontSize = f2(d * 0.36) + "px"; el.querySelector(".b").style.fontSize = f2(d * (hi ? 0.11 : 0.118)) + "px"; return true; }
        }
      }
    }
    return false;
  }
  /* No clear spot: the card's type steps down together until one opens. */
  function makeRoom(el) {
    const shrink = (sel, floor) => {
      const els = $$(sel), base = els.map((e) => parseFloat(getComputedStyle(e).fontSize));
      for (let k = 0.95; k > floor; k -= 0.05) { if (placeSeal(el)) return true; els.forEach((e, i) => { e.style.fontSize = f2(base[i] * k) + "px"; }); }
      return placeSeal(el);
    };
    if (placeSeal(el)) return;
    if (shrink(".sub, .row .k, .row .v, .box .p, .label .tg, .offer, .label .nm", 0.7)) return;
    shrink(".head", 0.6);
  }

  /* --- the calendar scenes: the brand's river, painted ----------------------------- */
  function scene(kind, w, h) {
    const hz = h * 0.42;
    const steps = `<polygon points="0,${f2(hz - 10)} ${f2(w * 0.15)},${f2(hz - 10)} ${f2(w * 0.15)},${f2(h * 0.56)} ${f2(w * 0.23)},${f2(h * 0.56)} ${f2(w * 0.23)},${f2(h * 0.71)} ${f2(w * 0.31)},${f2(h * 0.71)} ${f2(w * 0.31)},${f2(h * 0.87)} ${f2(w * 0.39)},${f2(h * 0.87)} ${f2(w * 0.39)},${h} 0,${h}" fill="${C.k}"/>`;
    const night = { sky: "#12110e", water: "#16404a", wave: "#5c9aa5" };
    if (kind === "moon") {
      let stars = ""; for (let i = 0; i < 18; i++) { const x = (i * 173) % (w - 20) + 10, y = (i * 61) % (hz - 50) + 14; stars += `<rect x="${x}" y="${y}" width="5" height="5" fill="${C.p}" transform="rotate(45 ${x + 2.5} ${y + 2.5})"/>`; }
      return river(w, h, { id: "s", cls: "sc", horizon: hz, sunX: w * 0.66, rows: 11, ...night, path: C.p, back: `${stars}<circle cx="${f2(w * 0.66)}" cy="${f2(hz * 0.5)}" r="${f2(h * 0.13)}" fill="${C.p}"/>`, front: steps });
    }
    if (kind === "newmoon") {
      return river(w, h, { id: "s", cls: "sc", horizon: hz, sunX: w * 0.66, rows: 11, ...night, path: "#5a4a1c", back: `<circle cx="${f2(w * 0.66)}" cy="${f2(hz * 0.5)}" r="${f2(h * 0.13)}" fill="none" stroke="#57513f" stroke-width="4"/>`, front: steps });
    }
    if (kind === "sunset") return river(w, h, { id: "s", cls: "sc", horizon: hz, sunX: w * 0.64, sunR: h * 0.21, rows: 11, sky: C.h, water: C.t, wave: C.p, path: C.y, front: steps });
    if (kind === "spring") return river(w, h, { id: "s", cls: "sc", horizon: hz, sunX: w * 0.5, sunR: h * 0.15, rows: 11, sky: C.y, water: C.t, wave: C.p, path: C.y,
      back: `<polygon points="0,${f2(hz)} ${f2(w * 0.18)},${f2(hz * 0.42)} ${f2(w * 0.36)},${f2(hz * 0.8)} ${f2(w * 0.7)},${f2(hz * 0.28)} ${w},${f2(hz * 0.72)} ${w},${f2(hz)}" fill="${C.m}"/>` });
    return river(w, h, { id: "s", cls: "sc", horizon: hz, sunX: w * 0.64, sunR: h * 0.24, rows: 11, sky: C.y, water: C.t, wave: C.p, path: C.y, front: steps });
  }

  /* =================================================================================
     Build, once the faces are in, since type is measured to fit.
     ================================================================================= */
  function build() {
    const root = document.getElementById("root");

    if (p.style === "calendar") {
      document.body.className = "cal";
      const orn = `<svg class="orn" viewBox="0 0 230 24" width="230" height="24"><circle cx="8" cy="12" r="3" fill="${C.h}"/><circle cx="34" cy="12" r="4" fill="${C.h}"/><rect x="54" y="10" width="40" height="4" fill="${C.h}"/><circle cx="115" cy="12" r="10" fill="${C.h}"/><rect x="136" y="10" width="40" height="4" fill="${C.h}"/><circle cx="196" cy="12" r="4" fill="${C.h}"/><circle cx="222" cy="12" r="3" fill="${C.h}"/></svg>`;
      root.innerHTML = `<div class="frame"></div><div class="col">
        ${orn}<div class="kick">${esc(p.kick)}</div>
        <div class="scene"></div>
        <div class="title d lines">${lines(p.title)}</div>
        ${p.sub ? `<div class="csub">${esc(p.sub)}</div>` : ""}
        ${p.line ? `<div class="line t">${esc(p.line)}</div>` : ""}
        ${rowsHtml(p.rows)}
        <div class="bar"><span class="go">${esc(p.cta)} →</span><span class="url">snanify.com</span></div>
      </div>`;
      const title = $(".cal .title");
      fitLines(title, p.titleSize || (hi ? 118 : 128), 56);
      fitWidth($(".cal .bar .go"), hi ? 46 : 50, 860 - $(".cal .bar .url").offsetWidth - 26);
      while ($(".cal .scene").clientHeight < 280 && parseFloat(title.style.fontSize) > 64) title.style.fontSize = (parseFloat(title.style.fontSize) - 4) + "px";
      const sc = $(".cal .scene");
      sc.innerHTML = scene(p.scene || "dawn", 900, Math.max(200, sc.clientHeight / sc.clientWidth * 900));
      pull(title, 0.4);
      $$(".cal .csub, .cal .line, .cal .row").forEach((el, i) => pull(el, 0.8 + i * 0.16));
      pull($(".cal .bar"), 1.8);
    }

    else if (p.style === "matchbox") {
      document.body.className = "match";
      const em = `<svg class="em" viewBox="0 0 300 190">${Array.from({ length: 13 }, (_, i) => { const a = Math.PI + (i / 12) * Math.PI; const pt = (r, q) => `${f2(150 + r * Math.cos(q))},${f2(112 + r * Math.sin(q))}`; return `<polygon points="${pt(70, a - 0.07)} ${pt(102, a)} ${pt(70, a + 0.07)}" fill="${C.k}"/>`; }).join("")}<clipPath id="ems"><rect width="300" height="112"/></clipPath><circle cx="150" cy="112" r="60" fill="${C.r}" clip-path="url(#ems)"/><rect x="88" y="126" width="124" height="12" fill="${C.k}"/><rect x="56" y="150" width="188" height="12" fill="${C.k}"/><rect x="20" y="174" width="260" height="12" fill="${C.k}"/></svg>`;
      root.innerHTML = `<div class="col">${topRow()}
        <div class="label"><div class="in">${em}<div class="nm caps lines">${lines(p.name)}</div><div class="tg t">${esc(p.tagline)}</div></div></div>
        <div class="head big d caps lines">${lines(p.head)}</div>
        ${p.sub ? `<div class="sub t">${esc(p.sub)}</div>` : ""}
        <div class="grow"></div>${foot()}${footRiver()}
      </div>${seal(p.seal, "right:52px;bottom:330px")}`;
      fitLines($(".label .nm"), hi ? 110 : 124, 50);
      fitLines($(".head"), hi ? 92 : 100, 44, 936);
      fitColumn($(".col"), [$(".head"), ...$$(".sub, .label .nm")]);
    }

    else if (p.style === "signboard") {
      document.body.className = "sign";
      let st = ""; for (let x = -60; x < W + 60; x += 80) st += `<polygon points="${x},0 ${x + 40},0 ${x + 96},56 ${x + 56},56" fill="${C.r}"/>`;
      root.innerHTML = `<svg style="position:absolute;left:0;top:0" width="${W}" height="56">${st}</svg>
        <div class="col">${topRow()}
        <div class="head big d caps lines"><span class="r">${esc(p.top)}</span><span>${esc(p.bottom)}</span></div>
        ${p.sub ? `<div class="sub t">${esc(p.sub)}</div>` : ""}
        ${rowsHtml(p.rows)}
        ${p.box ? `<div class="box"><div class="h">${red(p.box.h)}</div><div class="p t">${esc(p.box.p)}</div></div>` : ""}
        <div class="grow"></div>${foot()}${footRiver()}
      </div>${seal(p.seal, "right:52px;bottom:330px")}`;
      fitLines($(".head"), hi ? 210 : 236, 90, 936);
      fitColumn($(".col"), [$(".head"), ...$$(".sub, .row .k, .row .v, .box .h, .box .p")]);
    }

    else {
      document.body.className = "plain";
      const words = `<div class="head big d caps lines">${lines(p.head)}</div>${p.sub ? `<div class="sub t">${esc(p.sub)}</div>` : ""}`;
      root.innerHTML = `<div class="col">${topRow()}
        ${p.phone ? `<div class="split"><div>${words}</div><div class="phone"><div class="screen"><img src="${p.phone}"></div></div></div>` : p.sheet ? `<div class="split wide"><div>${words}</div><div class="sheet"><img src="${p.sheet}"></div></div>` : words}
        ${p.band ? `<div class="band t">${esc(p.band)}</div>` : ""}
        ${p.breath ? `<div class="tank">${river(930, 620, { id: "b", cls: "breath", horizon: 300, sunX: 465, rows: 10, sky: C.p, ink: C.k })}<div class="num"></div><div class="say t"></div></div>` : ""}
        ${rowsHtml(p.rows)}
        <div class="grow"></div>${foot()}${footRiver()}
      </div>${seal(p.seal, p.sealAt || "right:52px;bottom:330px")}`;
      fitLines($(".head"), p.headSize || (hi ? 150 : 176), 50, p.phone ? 572 : p.sheet ? 442 : 936);
      fitColumn($(".col"), [$(".head"), ...$$(".sub, .row .k, .row .v, .band")]);
    }

    /* Shared motion: the headline's lines pull in one after another, the rest
       follows, the seal stamps, the press sinks once near the end, the river
       flows throughout. */
    if (p.style !== "calendar") {
      $$(".head > span").forEach((l, i) => pull(l, 0.2 + i * 0.2));
      $$(".label, .split .phone, .split .sheet, .sub, .band, .box, .row, .tank, .offer").forEach((el, i) => pull(el, 0.7 + i * 0.14));
      pull($(".pressrow"), 1.5);
      sink($(".press"), window.DURATION - 1.5);
      fitWidth($(".press .go"), hi ? 56 : 62, 936 - 9 - 74 - $(".press .url").offsetWidth - 24);
    }
    const sl = $(".seal");
    if (sl) { makeRoom(sl); stamp(sl, 1.2, p.sealTurn ?? -8); }
    flow();

    if (p.breath) {
      /* breathe: the waves rise for 4s and fall for 6s; count: each second's
         numeral fades across its second. */
      const g = $(".breath .waves"), num = $(".tank .num"), say = $(".tank .say");
      on((t) => {
        const c = Math.max(0, t - 1) % 10;
        const lvl = t < 1 ? 0 : c < 4 ? inOut(c / 4) : 1 - inOut((c - 4) / 6);
        const s = 0.45 + 0.55 * lvl;
        g.setAttribute("transform", `translate(0 ${f2(620 - 620 * s)}) scale(1 ${f2(s)})`);
        num.textContent = t < 1 ? "" : String(c < 4 ? Math.floor(c) + 1 : Math.floor(c - 4) + 1);
        num.style.opacity = f2(t < 1 ? 0 : 1 - (c % 1) * 0.75);
        say.textContent = t < 1 ? "" : c < 4 ? p.breath.in : p.breath.out;
      });
    }
  }

  const faces = ["800 40px Eczar", "700 40px Eczar", "400 40px 'Martel Sans'", "700 40px 'Martel Sans'", "800 40px 'Martel Sans'", "600 40px 'Noto Serif Devanagari'"];
  Promise.all(faces.flatMap((f) => [document.fonts.load(f, "Snan"), document.fonts.load(f, "गंगा")])).then(() => document.fonts.ready).then(() => {
    build();
    window.frame(p.still ?? window.DURATION);
    document.body.dataset.ready = "1";
  });
</script>
</body>
</html>
