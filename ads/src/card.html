<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Eczar:wght@400;600;700&family=Martel+Sans:wght@400;600;700&display=block" rel="stylesheet">
<style>
  /* Video overlays at 1080 x 1920. A caption is a solid ink band on a
     transparent frame, placed below the top 14% Reels keeps clear; the end
     card is a whole frame of paper. Site tokens, no shadows, no blur. */
  :root { --paper: #f2ead9; --ink: #16130f; --ink-2: #57513f; --spot: #b32620; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
  .band { position: absolute; left: 0; right: 0; top: 300px; background: var(--ink); color: var(--paper); padding: 34px 72px 40px; }
  .band .t { font-family: "Eczar", serif; font-weight: 700; font-size: 82px; line-height: 1.08; font-synthesis: none; }
  [lang="hi"] .band .t { line-height: 1.32; font-size: 74px; }
  .band .s { font-family: "Martel Sans", sans-serif; font-size: 36px; margin-top: 10px; opacity: 0.85; }
  .cap { position: absolute; left: 72px; right: 72px; top: 300px; height: 262px; display: flex; align-items: flex-end; font-family: "Eczar", serif; font-weight: 700; font-size: 84px; line-height: 1.04; color: var(--ink); font-synthesis: none; }
  [lang="hi"] .cap { font-size: 72px; line-height: 1.3; }
  svg.f { position: absolute; inset: 0; }
  .kick { position: absolute; left: 72px; right: 72px; top: 196px; font-family: "Eczar", serif; font-weight: 600; font-size: 32px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--spot); }
  [lang="hi"] .kick { letter-spacing: 0; font-size: 36px; }
  .end { position: absolute; inset: 0; background: var(--paper); color: var(--ink); padding: 300px 72px 0; }
  .end .ph { position: absolute; left: 230px; top: 1130px; width: 620px; height: 900px; border: 20px solid var(--ink); border-bottom: 0; border-radius: 48px 48px 0 0; overflow: hidden; background: var(--paper); }
  .end .ph img { width: 100%; display: block; }
  .end .k { font-family: "Eczar", serif; font-weight: 600; font-size: 34px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--spot); }
  [lang="hi"] .end .k { letter-spacing: 0; font-size: 38px; }
  .end .h { font-family: "Eczar", serif; font-weight: 700; font-size: 120px; line-height: 1.02; margin-top: 26px; font-synthesis: none; }
  [lang="hi"] .end .h { line-height: 1.3; font-size: 104px; }
  .end .o { font-family: "Eczar", serif; font-weight: 700; font-size: 64px; margin-top: 40px; border-top: 4px solid var(--ink); padding-top: 30px; }
  .end .u { font-family: "Martel Sans", sans-serif; font-size: 48px; margin-top: 24px; color: var(--ink-2); }
</style>
</head>
<body>
<script>
  const p = JSON.parse(decodeURIComponent(location.hash.slice(1)));
  document.documentElement.lang = p.lang;
  const esc = (s) => (s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
  /* The phone frame: paper everywhere but the screen, the bezel around it
     running off the bottom edge, the caption above. Screen 868 x 1330 at
     (106, 590); cut-video.sh shares these numbers. Caption and screen sit
     inside the 4:5 crop Meta applies in feeds (y 285 to 1635), and the
     kicker above it is the part a feed may lose. */
  const frame = (t, k) => `<svg class="f" width="1080" height="1920"><path fill-rule="evenodd" fill="#f2ead9" d="M0 0H1080V1920H0Z M106 590V1920H974V590Z"/><rect x="94" y="578" width="892" height="1420" rx="60" fill="none" stroke="#16130f" stroke-width="24"/></svg><div class="kick">${esc(k)}</div><div class="cap">${esc(t)}</div>`;
  document.body.innerHTML = p.kind === "frame" ? frame(p.t, p.k) : p.kind === "end"
    ? `<div class="end"><div class="k">${esc(p.k)}</div><div class="h">${esc(p.h)}</div><div class="o">${esc(p.o)}</div><div class="u">snanify.com</div>${p.img ? `<div class="ph"><img src="${p.img}"></div>` : ""}</div>`
    : `<div class="band" style="top:${p.top ?? 300}px"><div class="t">${esc(p.t)}</div>${p.s ? `<div class="s">${esc(p.s)}</div>` : ""}</div>`;
  document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });
</script>
</body>
</html>
