<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Eczar:wght@400;600;700&family=Martel+Sans:wght@400;600;700&display=block" rel="stylesheet">
<style>
  /* One daily Facebook post, 1080 x 1350, set like a page of the almanac:
     the masthead, a red kicker, the headline, then a figure or a plate, and
     the site's address on the foot rule. Site tokens only, no gradients,
     glows, blurs or rounded corners. Filled by render-post.mjs. */
  :root { --paper: #f2ead9; --paper-2: #eae0c9; --ink: #16130f; --ink-2: #57513f; --spot: #b32620; --rule: #c3b697; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: var(--paper); }
  body { width: 1080px; height: 1350px; overflow: hidden; color: var(--ink); font-family: "Martel Sans", sans-serif; }
  .frame { width: 100%; height: 100%; padding: 64px 72px 60px; display: flex; flex-direction: column; }
  .mast { display: flex; align-items: center; gap: 18px; padding-bottom: 20px; border-bottom: 4px solid var(--ink); }
  .mast svg { width: 56px; height: 56px; flex: none; }
  .mast .name { font-family: "Eczar", serif; font-weight: 700; font-size: 44px; line-height: 1; font-synthesis: none; }
  .mast .date { margin-left: auto; font-size: 26px; color: var(--ink-2); }
  .kicker { margin-top: 44px; font-family: "Eczar", serif; font-weight: 600; font-size: 30px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--spot); }
  .head { margin-top: 14px; font-family: "Eczar", serif; font-weight: 700; font-size: var(--head); line-height: 1.04; letter-spacing: -0.01em; font-synthesis: none; }
  [lang="hi"] .kicker { letter-spacing: 0; font-size: 34px; }
  [lang="hi"] .head { line-height: 1.3; }
  [lang="hi"] .body { line-height: 1.75; }
  .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; margin: 34px 0 26px; }
  .figure { font-family: "Eczar", serif; font-weight: 700; font-size: 168px; line-height: 1; font-synthesis: none; }
  .figure small { font-size: 64px; font-weight: 600; margin-left: 12px; }
  .note { font-size: 32px; color: var(--ink-2); margin-top: 18px; }
  .rows { border-top: 2px solid var(--ink); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; padding: 20px 0; border-bottom: 1px solid var(--rule); }
  .row .k { font-size: 26px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); }
  [lang="hi"] .row .k { letter-spacing: 0; text-transform: none; font-size: 30px; }
  .row .v { font-family: "Eczar", serif; font-weight: 600; font-size: 44px; text-align: right; font-synthesis: none; }
  .plate { width: 100%; flex: 1; min-height: 0; border: 2px solid var(--ink); background-size: cover; background-position: center; }
  .credit { font-size: 20px; color: var(--ink-2); margin-top: 10px; }
  .body { font-size: 34px; line-height: 1.5; color: var(--ink-2); max-width: 920px; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; border-top: 3px solid var(--ink); padding-top: 20px; margin-top: 26px; }
  .foot .cta { font-family: "Eczar", serif; font-weight: 700; font-size: 40px; font-synthesis: none; }
  .foot .site { font-size: 30px; color: var(--spot); font-weight: 700; }
</style>
</head>
<body>
<div class="frame">
  <div class="mast">
    <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="#f2ead9"/><circle cx="24" cy="24" r="21.4" stroke="#16130f" stroke-width="3.2" fill="none"/><clipPath id="s"><circle cx="24" cy="24" r="20"/></clipPath><g clip-path="url(#s)"><circle cx="24" cy="16.2" r="6.6" fill="#b32620"/><rect x="11" y="27.8" width="26" height="3.2" fill="#16130f"/><rect x="4" y="34.6" width="40" height="3.4" fill="#16130f"/></g></svg>
    <div class="name">Snanify</div>
    <div class="date" id="date"></div>
  </div>
  <div class="kicker" id="kicker"></div>
  <div class="head" id="head"></div>
  <div class="stage" id="stage"></div>
  <div class="body" id="body"></div>
  <div class="foot"><div class="cta" id="cta"></div><div class="site">snanify.com</div></div>
</div>
<script>
  const p = JSON.parse(decodeURIComponent(location.hash.slice(1)));
  document.documentElement.lang = p.lang || "en";
  document.body.style.setProperty("--head", (p.headSize || 84) + "px");
  const text = (id, v) => { document.getElementById(id).textContent = v || ""; };
  text("date", p.date); text("kicker", p.kicker); text("head", p.head); text("body", p.body); text("cta", p.cta);
  const stage = document.getElementById("stage");
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  if (p.img) {
    stage.innerHTML = `<div class="plate" style="background-image:url('${esc(p.img)}')"></div>` + (p.credit ? `<div class="credit">${esc(p.credit)}</div>` : "");
  } else if (p.figure) {
    stage.innerHTML = `<div class="figure">${esc(p.figure)}${p.unit ? `<small>${esc(p.unit)}</small>` : ""}</div>` + (p.note ? `<div class="note">${esc(p.note)}</div>` : "");
  } else if (p.rows) {
    stage.innerHTML = `<div class="rows">${p.rows.map(([k, v]) => `<div class="row"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("")}</div>`;
  } else {
    stage.style.flex = "0.2";
  }
  document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });
</script>
</body>
</html>
