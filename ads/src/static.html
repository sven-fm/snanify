<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Eczar:wght@400;600;700&family=Martel+Sans:wght@400;600;700&display=block" rel="stylesheet">
<style>
  /* One static ad, drawn in the site's own tokens: paper, ink, one red.
     No gradients, glows, blurs or rounded corners; the phone is the one
     rounded shape, as on the site. Filled by render-statics.mjs. */
  :root { --paper: #f2ead9; --paper-2: #eae0c9; --ink: #16130f; --ink-2: #57513f; --spot: #b32620; --rule: #c3b697; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: var(--paper); }
  body { width: var(--w); height: var(--h); overflow: hidden; color: var(--ink); font-family: "Martel Sans", sans-serif; }
  .frame { position: relative; width: 100%; height: 100%; padding: var(--pad-top) 72px var(--pad-bottom); display: flex; flex-direction: column; }
  .kicker { font-family: "Eczar", serif; font-weight: 600; font-size: 30px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--spot); }
  .hook { font-family: "Eczar", serif; font-weight: 700; font-size: var(--hook); line-height: 1.02; letter-spacing: -0.01em; margin-top: 18px; font-synthesis: none; }
  .sub { font-size: 34px; line-height: 1.45; color: var(--ink-2); margin-top: 22px; max-width: 900px; }
  [lang="hi"] .hook { line-height: 1.25; }
  [lang="hi"] .kicker { letter-spacing: 0; font-size: 34px; }
  [lang="hi"] .sub { line-height: 1.7; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; margin: 36px 0 28px; min-height: 0; }
  .phone { position: relative; height: 100%; aspect-ratio: 1080 / 2020; }
  .phone svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .phone img { position: absolute; left: 4.6%; top: 6.93%; width: 90.8%; height: auto; }
  .sheet { height: 100%; max-width: 100%; border: 2px solid var(--ink); object-fit: cover; object-position: top; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; border-top: 3px solid var(--ink); padding-top: 22px; }
  .offer { font-family: "Eczar", serif; font-weight: 700; font-size: 52px; font-synthesis: none; }
  .site { font-size: 30px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="frame">
  <div class="kicker" id="kicker"></div>
  <div class="hook" id="hook"></div>
  <div class="sub" id="sub"></div>
  <div class="stage" id="stage"></div>
  <div class="foot"><div class="offer" id="offer"></div><div class="site">snanify.com</div></div>
</div>
<script>
  const p = JSON.parse(decodeURIComponent(location.hash.slice(1)));
  document.documentElement.lang = p.lang;
  const s = document.body.style;
  s.setProperty("--w", p.w + "px");
  s.setProperty("--h", p.h + "px");
  s.setProperty("--hook", p.hookSize + "px");
  s.setProperty("--pad-top", p.h > 1500 ? "250px" : "84px");
  s.setProperty("--pad-bottom", p.h > 1500 ? "330px" : "72px");
  for (const k of ["kicker", "hook", "sub", "offer"]) document.getElementById(k).textContent = p[k] ?? "";
  const stage = document.getElementById("stage");
  if (p.art === "phone") {
    stage.innerHTML = `<div class="phone"><svg viewBox="0 0 1080 2020" preserveAspectRatio="none"><rect x="6" y="6" width="1068" height="2008" rx="120" fill="#16130f"/><rect x="50" y="140" width="980" height="1742" fill="#f2ead9"/><rect x="430" y="60" width="220" height="34" rx="17" fill="#2b2620"/></svg><img src="${p.img}"></div>`;
  } else {
    stage.innerHTML = `<img class="sheet" src="${p.img}">`;
  }
  document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });
</script>
</body>
</html>
