<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Eczar:wght@600;700;800&family=Martel+Sans:wght@400;700;800&display=block" rel="stylesheet">
<style>
  /* PLAIN: "dumb is trump". One idea per ad, said literally, read in three
     seconds by a thumb that is not stopping to think: do a digital Ganga
     snan from home, then send it to the family. Solid yellow, black type,
     the key words in red, one red button. No jokes to decode, no stripes,
     stamps or scenes. Filled by render-plain.mjs. */
  * { margin: 0; box-sizing: border-box; }
  :root { --y: #f2c230; --k: #141210; --r: #c8251d; }
  body { width: var(--w); height: var(--h); overflow: hidden; background: var(--y); color: var(--k); font-family: "Martel Sans", sans-serif; }
  .d { font-family: "Eczar", serif; font-synthesis: none; }
  .caps { text-transform: uppercase; }
  [lang="hi"] .caps { text-transform: none; }
  .col { height: 100%; display: flex; flex-direction: column; padding: var(--top) 72px var(--bottom); }
  .grow { flex: 1; min-height: 20px; }
  .r { color: var(--r); }
  .mark { font-size: 40px; }

  /* v3 wordmark: Eczar 800, one weight, the sindoor bindu on the dotless i (globals.css, measured). */
  .wm { font-family: "Eczar", serif; font-weight: 800; letter-spacing: -0.015em; line-height: 1; font-synthesis: none; display: inline-block; }
  .wm-i { position: relative; display: inline-block; }
  .wm-i svg { position: absolute; left: 53.6%; bottom: 0.789em; width: 0.237em; height: 0.237em; transform: translateX(-50%); }
  .lock { display: inline-flex; align-items: center; gap: 0.5em; }
  .lock > svg { width: 1.25em; height: 1.25em; flex: none; }
  .big { font-weight: 800; line-height: 0.95; letter-spacing: -0.01em; }
  [lang="hi"] .big { line-height: 1.22; letter-spacing: 0; }
  .sub { font-weight: 800; font-size: 44px; line-height: 1.2; margin-top: 26px; }

  .offer { font-weight: 800; font-size: 40px; text-align: center; margin-bottom: 18px; }
  .cta { background: var(--r); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 28px 36px; }
  .cta .go { font-weight: 800; font-size: 76px; line-height: 1; white-space: nowrap; }
  [lang="hi"] .cta .go { font-size: 62px; line-height: 1.25; }
  .cta .url { font-weight: 700; font-size: 36px; }

  /* home: the words on the left, the real start screen in a phone. */
  .home .main { display: grid; grid-template-columns: minmax(0, 1fr) var(--phone); gap: 30px; align-items: center; margin-top: 30px; }
  .home .big { font-size: var(--homebig); }
  .phone { position: relative; width: var(--phone); aspect-ratio: 1080 / 2020; background: var(--k); border-radius: 60px; padding: 22px; }
  .phone .screen { width: 100%; height: 100%; border-radius: 40px; overflow: hidden; background: #f2ead9; }
  .phone .screen img { width: 100%; display: block; }

  /* send: the sheet arriving in a family chat. A chat drawn plainly: no
     app's logo, no invented replies. */
  .send .big { font-size: var(--sendbig); margin-top: 26px; }
  .chat { margin-top: 36px; background: #efe7da; border: 6px solid var(--k); }
  .chat .bar { background: #1f2c33; color: #fff; display: flex; align-items: center; gap: 18px; padding: 18px 24px; }
  .chat .av { display: flex; }
  .chat .av i { width: 46px; height: 46px; border-radius: 50%; border: 3px solid #1f2c33; margin-left: -14px; display: block; }
  .chat .av i:first-child { margin-left: 0; }
  .chat .title { font-weight: 800; font-size: 36px; }
  .chat .body { padding: 26px 24px 30px; display: flex; justify-content: flex-end; }
  .bubble { background: #d9fdd3; padding: 10px 10px 8px; width: var(--bubble); border-radius: 18px 4px 18px 18px; }
  /* The sheet cropped to its photograph's lower half and the family's names
     (y 400 to 1000 of the 1920 memento), which is what makes it theirs. */
  .bubble .img { height: calc(var(--imgw) * 0.56); overflow: hidden; border-radius: 10px; }
  .bubble .img img { width: 100%; display: block; margin-top: calc(var(--imgw) * -0.37); }
  .bubble .cap { font-size: 30px; font-weight: 700; padding: 10px 6px 0; }
  .bubble .meta { text-align: right; font-size: 22px; color: #667781; padding: 0 6px; }
  .bubble .meta b { color: #53bdeb; font-weight: 700; }

  /* steps: three numbered lines, nothing else. */
  .steps .title { font-weight: 800; font-size: var(--stepstitle); line-height: 1; margin-top: 30px; }
  [lang="hi"] .steps .title { line-height: 1.25; }
  .steps ol { list-style: none; margin-top: 50px; display: flex; flex-direction: column; gap: var(--stepgap); }
  .steps li { display: flex; align-items: center; gap: 34px; font-weight: 800; font-size: var(--stepsize); line-height: 1.05; }
  [lang="hi"] .steps li { line-height: 1.3; }
  .steps .n { flex: none; width: var(--num); height: var(--num); border-radius: 50%; background: var(--r); color: #fff; display: flex; align-items: center; justify-content: center; font-size: calc(var(--num) * 0.56); }

  /* The video: a caption frame round the phone's screen (868 x 1330 at 106,
     590, shared with cut-video.sh; transparent there) and a plain end card. */
  .vframe { background: transparent !important; }
  .vframe svg { position: absolute; inset: 0; }
  .vframe .kick { position: absolute; left: 72px; right: 72px; top: 186px; font-weight: 800; font-size: 34px; color: var(--r); }
  .vframe .vcap { position: absolute; left: 72px; right: 72px; top: 290px; height: 272px; display: flex; align-items: flex-end; font-weight: 800; font-size: 104px; line-height: 0.95; letter-spacing: -0.01em; }
  [lang="hi"] .vframe .vcap { font-size: 92px; line-height: 1.22; }
  .vend .ph { position: absolute; left: 230px; top: 1190px; width: 620px; height: 800px; border: 20px solid var(--k); border-bottom: 0; border-radius: 48px 48px 0 0; overflow: hidden; background: #f2ead9; }
  .vend .ph img { width: 100%; display: block; }
  .vend .big { font-size: 118px; }
  [lang="hi"] .vend .big { font-size: 104px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const p = JSON.parse(decodeURIComponent(location.hash.slice(1)));
  document.documentElement.lang = p.lang;
  const tall = p.h > 1500;
  const hi = p.lang === "hi";
  const s = document.body.style;
  const set = (k, v) => s.setProperty(k, v);
  set("--w", p.w + "px");
  set("--h", p.h + "px");
  /* Stories keep their top 250px and bottom 330px clear of Meta's own chrome. */
  set("--top", tall ? "250px" : "80px");
  set("--bottom", tall ? "330px" : "72px");
  set("--phone", (tall ? 440 : 360) + "px");
  set("--homebig", (hi ? (tall ? 98 : 98) : (tall ? 100 : 112)) + "px");
  set("--sendbig", (hi ? (tall ? 100 : 88) : (tall ? 112 : 96)) + "px");
  const bubble = tall ? 600 : 500;
  set("--bubble", bubble + "px");
  set("--imgw", (bubble - 20) + "px");
  set("--stepstitle", (hi ? 86 : 92) + "px");
  set("--stepsize", (hi ? 66 : 74) + "px");
  set("--num", (tall ? 130 : 116) + "px");
  set("--stepgap", (tall ? 56 : 40) + "px");
  const MARK = (ink) => `<svg viewBox="0 0 48 48" aria-hidden="true"><defs><clipPath id="mk"><circle cx="24" cy="24" r="20"/></clipPath></defs><circle cx="24" cy="24" r="21.6" fill="#f2ead9" stroke="${ink}" stroke-width="2.4"/><g clip-path="url(#mk)"><path d="M15.4 24.6A8.6 8.6 0 0 1 32.6 24.6Z" fill="#c8251d"/><rect y="24.6" width="48" height="1.4" fill="${ink}"/><g fill="#1d5a6a"><rect x="8" y="29" width="32" height="1.8"/><rect x="5" y="33.4" width="38" height="2"/><rect x="2" y="38" width="44" height="2.2"/></g></g></svg>`;
  const WM = (color, ink = "#141210") => `<span class="lock" style="color:${color}">${MARK(ink)}<span class="wm">Snan<span class="wm-i">\u0131<svg viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="#c8251d"/></svg></span>fy</span></span>`;
  const esc = (t) => String(t ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
  /* The river's name in red, wherever the line says it. */
  const red = (t) => esc(t).replace(/(Ganga|गंगा)/, '<span class="r">$1</span>');
  const mark = `<div class="mark">${WM("#141210")}</div>`;
  const foot = `<div class="offer d">${esc(p.offer)}</div><div class="cta d"><span class="go caps">${esc(p.cta)} →</span><span class="url">snanify.com</span></div>`;
  const root = document.getElementById("root");

  if (p.style === "home") {
    document.body.className = "home";
    root.innerHTML = `<div class="col">${mark}
      <div class="grow"></div>
      <div class="main">
        <div>
          <div class="big d caps">${red(p.a)}</div>
          <div class="big d caps r" style="margin-top:14px">${esc(p.b)}</div>
          <div class="sub">${esc(p.sub)}</div>
        </div>
        <div class="phone"><div class="screen"><img src="${p.screen}"></div></div>
      </div>
      <div class="grow"></div>
      ${foot}
    </div>`;
  } else if (p.style === "send") {
    document.body.className = "send";
    root.innerHTML = `<div class="col">${mark}
      <div class="big d caps">${esc(p.a)}</div>
      <div class="big d caps r">${esc(p.b)}</div>
      <div class="grow"></div>
      <div class="chat">
        <div class="bar"><span class="av"><i style="background:#c8a07a"></i><i style="background:#8fb3c9"></i><i style="background:#d9a6b5"></i></span><span class="title">${esc(p.chat)}</span></div>
        <div class="body"><div class="bubble">
          <div class="img"><img src="${p.sheet}"></div>
          <div class="cap">${esc(p.caption)}</div>
          <div class="meta">6:12 <b>✓✓</b></div>
        </div></div>
      </div>
      <div class="grow"></div>
      ${foot}
    </div>`;
  } else if (p.style === "frame") {
    document.body.className = "vframe";
    root.innerHTML = `<svg width="1080" height="1920" viewBox="0 0 1080 1920">
        <path fill-rule="evenodd" fill="#f2c230" d="M0 0H1080V1920H0Z M106 590V1920H974V590Z"/>
        <rect x="94" y="578" width="892" height="1420" rx="60" fill="none" stroke="#141210" stroke-width="24"/>
      </svg>
      <div class="kick d caps">${esc(p.k)}</div>
      <div class="vcap d caps"><span>${red(p.t)}</span></div>`;
  } else if (p.style === "end") {
    document.body.className = "vend";
    root.innerHTML = `<div class="col" style="padding-bottom:0">${mark}
      <div class="big d caps" style="margin-top:24px">${red(p.a)}</div>
      <div class="big d caps r">${esc(p.b)}</div>
      <div class="sub">${esc(p.sub)}</div>
      <div style="margin-top:34px">${foot}</div>
    </div>${p.img ? `<div class="ph"><img src="${p.img}"></div>` : ""}`;
  } else {
    document.body.className = "steps";
    root.innerHTML = `<div class="col">${mark}
      <div class="title d caps">${red(p.title)}</div>
      <div class="grow"></div>
      <ol>${p.steps.map((t, i) => `<li class="d"><span class="n">${i + 1}</span><span>${esc(t)}</span></li>`).join("")}</ol>
      <div class="grow"></div>
      ${foot}
    </div>`;
  }
  document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });
</script>
</body>
</html>
