<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Eczar:wght@600;700;800&family=Martel+Sans:wght@400;700;800&display=block" rel="stylesheet">
<style>
  /* The Facebook Page in PLAIN, the brand kit's current campaign direction
     (brand/README.md): solid marigold, ink type, the key words in sindoor, one
     sindoor press on a hard ink wall, the seal, and the river at the foot.
     Two kinds, filled by render-page.mjs:
     - cover, 1640 x 624. Phones crop the sides to x 265 to 1375; the desktop
       Page sets the profile picture over the bottom centre, the app over the
       bottom left. So the words and the press sit in the top two thirds of
       the middle, and the bottom carries only the river.
     - list, 1080 x 1350: a capitals title, ruled rows, the offer and the press. */
  * { margin: 0; box-sizing: border-box; }
  :root { --y: #f2c230; --k: #141210; --r: #c8251d; --t: #1d5a6a; --p: #f2ead9; }
  body { width: var(--w); height: var(--h); overflow: hidden; background: var(--y); color: var(--k); font-family: "Martel Sans", sans-serif; position: relative; }
  .d { font-family: "Eczar", serif; font-synthesis: none; }
  .caps { text-transform: uppercase; }
  [lang="hi"] .caps { text-transform: none; }
  .r { color: var(--r); }
  .big { font-weight: 800; line-height: 0.95; letter-spacing: -0.01em; }
  [lang="hi"] .big { line-height: 1.22; letter-spacing: 0; }

  /* v3 wordmark and mark, as in plain.html. */
  .wm { font-family: "Eczar", serif; font-weight: 800; letter-spacing: -0.015em; line-height: 1; font-synthesis: none; display: inline-block; }
  .wm-i { position: relative; display: inline-block; }
  .wm-i svg { position: absolute; left: 53.6%; bottom: 0.789em; width: 0.237em; height: 0.237em; transform: translateX(-50%); }
  .lock { display: inline-flex; align-items: center; gap: 0.5em; }
  .lock > svg { width: 1.25em; height: 1.25em; flex: none; }

  /* The press: sindoor, a 2px ink border, a hard ink wall below and right. */
  .press { display: inline-flex; align-items: center; gap: 0.6em; background: var(--r); color: #fff; border: 3px solid var(--k); box-shadow: 9px 9px 0 0 var(--k); font-weight: 800; white-space: nowrap; }
  /* The seal: a sindoor stamp, marigold Eczar 800, a dashed marigold ring, turned. */
  .seal { position: absolute; border-radius: 50%; background: var(--r); color: var(--y); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transform: rotate(-8deg); }
  .seal::before { content: ""; position: absolute; inset: 9px; border: 3px dashed var(--y); border-radius: 50%; }
  .seal b { font-family: "Eczar", serif; font-weight: 800; line-height: 0.92; }
  .seal span { font-family: "Eczar", serif; font-weight: 800; line-height: 1.05; }
  .river { position: absolute; left: 0; bottom: 0; width: 100%; }

  /* --- cover ------------------------------------------------------------- */
  .cover .mark { position: absolute; left: 0; right: 0; top: 34px; text-align: center; font-size: 30px; }
  .cover .head { position: absolute; left: 0; right: 0; top: 84px; text-align: center; font-size: 100px; }
  .cover .sub { position: absolute; left: 0; right: 0; top: 284px; text-align: center; font-weight: 800; font-size: 32px; }
  .cover .act { position: absolute; left: 0; right: 0; top: 342px; display: flex; justify-content: center; }
  .cover .press { font-size: 42px; padding: 16px 32px; }
  .cover .press small { font-family: "Martel Sans", sans-serif; font-weight: 700; font-size: 28px; }
  .cover .seal { left: 1150px; top: 300px; width: 156px; height: 156px; }
  .cover .seal b { font-size: 58px; }
  .cover .seal span { font-size: 21px; }

  /* --- list -------------------------------------------------------------- */
  .list .col { height: 100%; display: flex; flex-direction: column; padding: 80px 72px 72px; }
  .list .mark { font-size: 40px; }
  .list .title { font-size: var(--title); margin-top: 40px; }
  .list .sub { font-weight: 800; font-size: 40px; line-height: 1.2; margin-top: 20px; }
  .list .rows { margin-top: 34px; border-top: 5px solid var(--k); }
  .list .row { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; padding: var(--rowpad, 18px) 0; border-bottom: 2px solid var(--k); }
  .list .row .a { font-family: "Eczar", serif; font-weight: 800; font-size: var(--rowa); line-height: 1.1; }
  .list .row .a .r { color: var(--r); }
  .list .row .b { font-weight: 700; font-size: var(--rowb); text-align: right; }
  [lang="hi"] .list .row .a { line-height: 1.3; }
  .list .grow { flex: 1; min-height: 20px; }
  .list .offer { font-weight: 800; font-size: 40px; text-align: center; margin-bottom: 22px; }
  .list .press { justify-content: space-between; padding: 26px 34px; margin-right: 9px; }
  .list .press .go { font-family: "Eczar", serif; font-size: 72px; line-height: 1; }
  [lang="hi"] .list .press .go { font-size: 60px; line-height: 1.25; }
  .list .press .url { font-weight: 700; font-size: 34px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const p = JSON.parse(decodeURIComponent(location.hash.slice(1)));
  document.documentElement.lang = p.lang || "en";
  const s = document.body.style;
  s.setProperty("--w", p.w + "px");
  s.setProperty("--h", p.h + "px");
  const esc = (t) => String(t ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
  /* Words wrapped in *stars* are set in sindoor. */
  const red = (t) => esc(t).replace(/\*([^*]+)\*/g, '<span class="r">$1</span>');
  const MARK = (ink) => `<svg viewBox="0 0 48 48" aria-hidden="true"><defs><clipPath id="mk"><circle cx="24" cy="24" r="20"/></clipPath></defs><circle cx="24" cy="24" r="21.6" fill="#f2ead9" stroke="${ink}" stroke-width="2.4"/><g clip-path="url(#mk)"><path d="M15.4 24.6A8.6 8.6 0 0 1 32.6 24.6Z" fill="#c8251d"/><rect y="24.6" width="48" height="1.4" fill="${ink}"/><g fill="#1d5a6a"><rect x="8" y="29" width="32" height="1.8"/><rect x="5" y="33.4" width="38" height="2"/><rect x="2" y="38" width="44" height="2.2"/></g></g></svg>`;
  const WM = `<span class="lock">${MARK("#141210")}<span class="wm">Snan<span class="wm-i">ı<svg viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="#c8251d"/></svg></span>fy</span></span>`;

  /* The river at the foot: an ink horizon, the sindoor sun sitting on it and
     cut by it, teal wave lines below. Coordinates rounded. */
  function river(w, h, sunX, horizon = 28, sunR = 44) {
    const lines = [];
    for (let i = 0; i < 7; i++) {
      const y = horizon + 12 + i * ((h - horizon - 14) / 7);
      const amp = 2 + i * 0.9, len = 90 + i * 14;
      let d = `M0 ${y.toFixed(2)}`;
      for (let x = 0; x <= w; x += len / 2) d += ` Q${(x + len / 4).toFixed(2)} ${(y + (((x / (len / 2)) % 2) ? amp : -amp)).toFixed(2)} ${(x + len / 2).toFixed(2)} ${y.toFixed(2)}`;
      lines.push(`<path d="${d}" fill="none" stroke="#1d5a6a" stroke-width="${(2.2 + i * 0.5).toFixed(2)}"/>`);
    }
    return `<svg class="river" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
      <clipPath id="sky"><rect width="${w}" height="${horizon}"/></clipPath>
      <circle cx="${sunX}" cy="${horizon}" r="${sunR}" fill="#c8251d" clip-path="url(#sky)"/>
      <rect y="${horizon}" width="${w}" height="5" fill="#141210"/>
      ${lines.join("")}</svg>`;
  }

  const root = document.getElementById("root");
  if (p.kind === "cover") {
    document.body.className = "cover";
    root.innerHTML = `
      <div class="mark">${WM}</div>
      <div class="head big d caps">${p.head.split("|").map(red).join("<br>")}</div>
      <div class="sub d">${esc(p.sub)}</div>
      <div class="act"><div class="press d">${esc(p.cta)} →<small>snanify.com</small></div></div>
      ${p.sealA ? `<div class="seal"><b>${esc(p.sealA)}</b><span>${esc(p.sealB)}</span></div>` : ""}
      ${river(1640, 200, 1200, 96, 84)}`;
  } else {
    document.body.className = "list";
    s.setProperty("--title", (p.titleSize || 108) + "px");
    s.setProperty("--rowa", (p.rowA || 50) + "px");
    s.setProperty("--rowb", (p.rowB || 28) + "px");
    if (p.rowPad) s.setProperty("--rowpad", p.rowPad + "px");
    root.innerHTML = `<div class="col">
      <div class="mark">${WM}</div>
      <div class="title big d caps">${red(p.title)}</div>
      ${p.sub ? `<div class="sub">${esc(p.sub)}</div>` : ""}
      <div class="rows">${p.rows.map(([a, b]) => `<div class="row"><div class="a">${red(a)}</div><div class="b">${esc(b)}</div></div>`).join("")}</div>
      <div class="grow"></div>
      <div class="offer d">${esc(p.offer)}</div>
      <div class="press d"><span class="go caps">${esc(p.cta)} →</span><span class="url">${esc(p.url || "snanify.com")}</span></div>
    </div>`;
  }
  document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });
</script>
</body>
</html>
