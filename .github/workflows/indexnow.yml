name: IndexNow

# Every production deploy tells the IndexNow engines to recrawl the sitemap.
# Vercel's GitHub app records each deployment here and marks it successful
# once it is live, so that status is the trigger: the run reads the live
# sitemap and posts every URL through scripts/indexnow.mjs. Submitting an
# unchanged URL does nothing, so a deploy that touched no page costs nothing.
on:
  deployment_status:
  workflow_dispatch:

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Let the production alias settle
        if: github.event_name == 'deployment_status'
        run: sleep 30
      - run: node scripts/indexnow.mjs
